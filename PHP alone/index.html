<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Студия создания сайтов</title>
</head>

<body>
    <section class="getintouch container" id="getintouch">

        <!-- Модальное окно "Успех" -->
        <div class="modal fade" id="successModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body text-center p-4">
                        <p>Данные сохранены! Мы свяжемся с вами.</p>
                    </div>
                </div>
            </div>
        </div>


        <!-- Модальное окно "Ошибка" -->
        <div class="modal fade" id="errorModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body text-center p-4">
                        <p>Пожалуйста, заполните все обязательные поля.</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Заголовок -->
        <div class="head_white_content">
            <h3>КОНТАКТЫ</h3>
            <span></span>
            <p>Оставьте свои данные в форме ниже и мы с вами свяжемся</p>
        </div>

        <form method="POST" action="send.php">
            <div class="row">
                <div class="col-md-6 col-6 textinput">
                    <p>Имя<span>*</span></p>
                    <input type="text" id="name" name="name">
                </div>

                <div class="col-md-6 col-6 textinput">
                    <p>Электронная почта<span>*</span></p>
                    <input type="text" id="e-mail" name="email">
                </div>
            </div>

            <div class="row">
                <div class="col-md-12 col-12 textmsg">
                    <p>Комментарий</p>
                    <textarea id="msg" cols="30" rows="10"name="message"></textarea>
                    <input id="send" type="submit" class="submit" value="Отправить запрос">
                </div>
            </div>
        </form>
    </section>

    <script src="scripts/jquery-2.1.1.js"></script>
    <script src="scripts/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const error = urlParams.get('error');
        
            // Показ модалки успеха
            if (status === 'success') {
                const successModal = new bootstrap.Modal(document.getElementById('successModal'));
                successModal.show();
            }
        
            // Показ модалки ошибки
            if (error === 'empty_fields') {
                const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));
                errorModal.show();
            }
        });
        </script>

</body>

</html>
